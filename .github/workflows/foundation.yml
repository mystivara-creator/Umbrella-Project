name: Foundation validation

on:
  push:
    paths:
      - 'README.md'
      - 'docs/**'
      - 'interfaces/**'
      - 'config/devices/**'
      - 'config/sources/**'
      - 'config/keys/**'
      - 'config/testing/**'
      - 'patches/**'
      - 'tools/**'
      - 'tests/**'
      - '.github/workflows/foundation.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate foundation metadata
        run: python3 tools/validate_foundation.py
      - name: Run build and ABI regression tests
        run: python3 -m unittest discover -s tests -v

